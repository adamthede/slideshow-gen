[package]
name = "marquee"
version = "0.1.0"
description = "Marquee desktop app — Tauri shell for slideshow-gen"
authors = ["Adam Thede <adam@thedetech.com>"]
edition = "2021"

[lib]
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
