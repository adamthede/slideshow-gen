name: Release (sign + notarize)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). If empty, builds HEAD with no release attached."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize Marquee.app
    runs-on: macos-14
    timeout-minutes: 60

    env:
      # Apple credentials (provided via repo secrets)
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Identity string Tauri's bundler passes to codesign. Must match the
      # common-name of the cert imported below.
      APPLE_SIGNING_IDENTITY: "Developer ID Application: ADAM SPENCER THEDE (U85N54PC5J)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slideshow-gen + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Freeze slideshow-gen sidecar with PyInstaller
        # Tauri's externalBin entry "binaries/slideshow-gen" expects a single
        # file at binaries/slideshow-gen-<rust-target-triple> — so we use
        # --onefile and copy the result to the triple-suffixed name. If
        # notarization fails because --onefile's self-extracting archive
        # can't be inspected, switch to --onedir and rewire as bundle
        # resources (a larger change — calling out in the PR).
        run: |
          set -euxo pipefail
          mkdir -p desktop/src-tauri/binaries
          pyinstaller \
            --noconfirm \
            --onefile \
            --name slideshow-gen \
            --console \
            --collect-all slideshow_gen \
            --collect-all reverse_geocoder \
            --collect-all pillow_heif \
            desktop/scripts/sidecar_entry.py
          cp dist/slideshow-gen desktop/src-tauri/binaries/slideshow-gen-aarch64-apple-darwin
          chmod +x desktop/src-tauri/binaries/slideshow-gen-aarch64-apple-darwin
          file desktop/src-tauri/binaries/slideshow-gen-aarch64-apple-darwin
          desktop/src-tauri/binaries/slideshow-gen-aarch64-apple-darwin --help

      - name: Vendor static FFmpeg (E5.S7)
        # Fetch a static ffmpeg + ffprobe for aarch64-apple-darwin into the
        # Tauri bundle-resource dir (Marquee.app/Contents/Resources/{ffmpeg,
        # ffprobe} after the build). A GPL build is allowed (FFmpeg is invoked
        # arm's-length as a separate child process; we ship its GPLv2 text +
        # written source offer — see docs/release-pipeline.md). The script still
        # FAILS CLOSED on a non-redistributable --enable-nonfree build or a
        # missing capability (h264_videotoolbox / drawtext / ...), so a
        # non-shippable or broken FFmpeg never ships.
        #
        # SUPPLY-CHAIN: this runner holds the Apple signing secrets, and the
        # script executes the downloaded binary to run its guards. GitHub sets
        # CI=true, so the script REFUSES to run unless both SHA256s are pinned.
        # Set these four repository variables (Settings -> Secrets and variables
        # -> Actions -> Variables) to a specific, verified build before the
        # first real run — see docs/release-pipeline.md:
        #   FFMPEG_VENDOR_URL, FFPROBE_VENDOR_URL,
        #   FFMPEG_VENDOR_SHA256, FFPROBE_VENDOR_SHA256
        env:
          FFMPEG_VENDOR_URL: ${{ vars.FFMPEG_VENDOR_URL }}
          FFPROBE_VENDOR_URL: ${{ vars.FFPROBE_VENDOR_URL }}
          FFMPEG_VENDOR_SHA256: ${{ vars.FFMPEG_VENDOR_SHA256 }}
          FFPROBE_VENDOR_SHA256: ${{ vars.FFPROBE_VENDOR_SHA256 }}
        run: |
          set -euxo pipefail
          desktop/scripts/vendor-ffmpeg.sh desktop/src-tauri/resources

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Developer ID Application certificate
        # Creates a fresh temporary keychain, imports the .p12, sets it as default
        # and unlocks it for the rest of the job. Tauri's bundler will find the
        # identity via APPLE_SIGNING_IDENTITY env var (passed automatically).
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Install Apple's "Developer ID Certification Authority (G2)" intermediate
          # into the build keychain. The .p12 holds only the leaf cert + private key;
          # this intermediate is NOT a built-in macOS root, so without it codesign
          # cannot assemble the full chain — find-identity reports "0 valid" and any
          # signature it produces can fail Gatekeeper on Macs that haven't cached it.
          #
          # This is a download on a runner that holds the Apple signing secrets, so
          # it follows the same supply-chain rule as vendor-ffmpeg.sh: pin the
          # SHA256 and fail closed. The pin is stable for the life of the signing
          # leaf (G2 is valid to 2031-09-17, and a fixed leaf chains to a fixed
          # intermediate). An exact-hash pin subsumes any subject/issuer check.
          INTERMEDIATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          INTERMEDIATE_SHA256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$INTERMEDIATE_PATH" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          ACTUAL_SHA256="$(shasum -a 256 "$INTERMEDIATE_PATH" | awk '{ print $1 }')"
          if [ "$ACTUAL_SHA256" != "$INTERMEDIATE_SHA256" ]; then
            echo "Developer ID G2 intermediate SHA256 mismatch — refusing to import:" >&2
            echo "  expected $INTERMEDIATE_SHA256" >&2
            echo "  actual   $ACTUAL_SHA256" >&2
            echo "If Apple legitimately rotated the intermediate, update the pin." >&2
            exit 1
          fi
          security import "$INTERMEDIATE_PATH" -t cert -f x509 -k "$KEYCHAIN_PATH"

          # Make the new keychain the default + first in the search path.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

          # Persist for later steps that need to re-unlock.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          # Sanity-check a *valid* signing identity is present. `find-identity -v`
          # only lists identities with a complete, trusted chain, so this fails the
          # job early (rather than mid-notarization) if the intermediate import or
          # the .p12 import went wrong. Snapshot the output and match a here-string
          # rather than `find-identity | grep -q`: under `set -o pipefail`, grep -q
          # closing the pipe early can SIGPIPE find-identity and turn a present
          # identity into a spurious job failure.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$IDENTITIES"
          case "$IDENTITIES" in
            *"Developer ID Application"*) : ;;
            *) echo "No valid Developer ID Application identity after import (broken chain?); aborting." >&2; exit 1 ;;
          esac

      - name: Sign the PyInstaller sidecar (hardened runtime)
        # E5.S2/E5.S3 — sign the frozen sidecar inside-out BEFORE the Tauri
        # build so the bundler embeds an already-signed, hardened-runtime binary.
        #   --options runtime    -> hardened runtime (required for notarization)
        #   --entitlements …     -> binary-entitlements.plist: grants only
        #                           disable-library-validation (E5.S3), the one
        #                           entitlement the PyInstaller bootloader needs to
        #                           dlopen the PSF-signed Python.framework it
        #                           extracts at launch. See docs/release-pipeline.md
        #                           "Hardened Runtime & Entitlements".
        #   --timestamp          -> secure timestamp (Apple notary requirement)
        #
        # The sidecar is a PyInstaller --onefile binary: the Python framework
        # and dylibs live INSIDE the binary's appended PKG archive, not as
        # separate on-disk Mach-O files, so the single signature here covers
        # them and `codesign --verify --deep --strict` finds no unsigned nested
        # code. No --onedir rewrite is required.
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          # No `set -x` here: this step runs `security unlock-keychain -p
          # "$KEYCHAIN_PASSWORD"`, and xtrace would echo the keychain password
          # into the CI logs. Keep errexit/nounset/pipefail only.
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIDECAR="desktop/src-tauri/binaries/slideshow-gen-aarch64-apple-darwin"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements desktop/src-tauri/binary-entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$SIDECAR"
          # Confirm the sidecar alone passes deep-strict before it's embedded.
          codesign --verify --deep --strict --verbose=2 "$SIDECAR"
          codesign -dvvv "$SIDECAR" 2>&1 | grep -E "Authority|flags|TeamIdentifier" || true

      - name: Sign vendored FFmpeg + ffprobe (hardened runtime)
        # E5.S7/E5.S3 — the bundled ffmpeg/ffprobe are nested Mach-O executables
        # that land in Marquee.app/Contents/Resources. Sign them inside-out BEFORE
        # the Tauri build so the bundler embeds already-signed, hardened-runtime
        # binaries and the E5.S2 deep-verify gate passes them.
        #   --options runtime    -> hardened runtime (notarization requirement)
        #   --timestamp          -> secure timestamp
        #   --entitlements …     -> binary-entitlements.plist (E5.S3): grants
        #                           disable-library-validation. Harmless for a
        #                           static ffmpeg (it only dlopens Apple-signed
        #                           system frameworks, always permitted), but
        #                           applied uniformly to all nested binaries for
        #                           consistency. See docs/release-pipeline.md.
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          # No `set -x`: this step unlocks the keychain with its password.
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          for bin in desktop/src-tauri/resources/ffmpeg desktop/src-tauri/resources/ffprobe; do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --entitlements desktop/src-tauri/binary-entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            codesign -dvvv "$bin" 2>&1 | grep -E "Authority|flags|TeamIdentifier" || true
          done

      - name: Build Tauri bundle (signed)
        working-directory: desktop
        env:
          # Tauri 2.x bundler reads these to sign the .app during the build.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Locate built Marquee.app
        id: locate
        run: |
          set -euo pipefail
          APP_PATH=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 2 -name "Marquee.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Marquee.app not found"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Deep-verify signing coverage (gate, pre-notarize)
        # E5.S2 — fail the build if ANY nested executable, framework, or dylib
        # inside Marquee.app is unsigned or invalidly signed. This runs AFTER
        # the bundle is built and signed and BEFORE notarization, so we never
        # spend a real notary submission on a bundle Apple would reject for
        # signing-coverage gaps. `--deep` recurses every nested code object;
        # `--strict` applies the full set of validity checks; `--verbose=2`
        # prints each object as it's verified for an auditable CI log.
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          echo "Inventory of nested code objects in the bundle:"
          # Informational, for the CI log. Two passes so we don't miss
          # extensionless Mach-O executables (e.g. Contents/MacOS/Marquee and
          # the sidecar), which a name-glob alone would skip:
          #   1. .framework bundles (dirs)
          #   2. every regular file that `file` reports as Mach-O (covers
          #      dylib/.so AND extensionless executables)
          find "$APP_PATH/Contents" -type d -name "*.framework" -print || true
          find "$APP_PATH/Contents" -type f -print0 \
            | xargs -0 file \
            | grep -E "Mach-O" || true
          echo "--- codesign --verify --deep --strict --verbose=2 ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "Deep-verify gate PASSED: every nested code object is validly signed."

      - name: Zip Marquee.app for notarization
        id: zip
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ZIP_PATH="$RUNNER_TEMP/Marquee.zip"
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize with notarytool
        run: |
          xcrun notarytool submit "${{ steps.zip.outputs.zip_path }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple ticket
        run: xcrun stapler staple "${{ steps.locate.outputs.app_path }}"

      - name: Verify signature + Gatekeeper acceptance
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate.outputs.app_path }}"
          spctl -a -t exec -vv "${{ steps.locate.outputs.app_path }}"

      - name: Re-zip stapled .app for release
        id: zip_final
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ZIP_PATH="$RUNNER_TEMP/Marquee-stapled.zip"
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marquee-aarch64-apple-darwin
          path: ${{ steps.zip_final.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to draft GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.zip_final.outputs.zip_path }}
          fail_on_unmatched_files: true

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
