[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slideshow-gen"
version = "0.1.0"
description = "Ken Burns slideshow generator with EXIF-aware metadata overlays"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "Pillow>=10.0",
    "pillow-heif>=0.18",
    "exifread>=3.0",
    "reverse_geocoder>=1.5",
]

[project.scripts]
slideshow-gen = "slideshow_gen.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slideshow_gen"]

[tool.pytest.ini_options]
# The vendored BMAD trees under _bmad/ and _bmad-output/ ship their own
# test_*.py self-tests. Without this, bare `pytest` collects them and errors.
testpaths = ["tests"]
